[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Public Sanity config (safe to commit — no secrets)
  NEXT_PUBLIC_SANITY_PROJECT_ID = "gsebaki2"
  NEXT_PUBLIC_SANITY_DATASET = "production"
  NEXT_PUBLIC_SANITY_API_VERSION = "2025-01-01"
  # Google Analytics 4 (public measurement ID)
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-Z4F8DL7KLQ"
  # Do NOT put SANITY_API_WRITE_TOKEN here — local .env.local only

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/districts/zone-*"
  to = "/districts"
  status = 301
